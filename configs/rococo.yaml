data_root: 'data/rococo'
features_dir: 'features/rococo'
tokens: false
k_aug: 2   # augmented views per sample, for the baselines only (FAnchor does not use them)
batch_size: 1024
record_every: 10

methods:
  fanchor:
    shared_dim: 256
    private_dim: 256
    shared_hidden: 512
    private_hidden: 512
    decoder_hidden: 512
    shared_layers: 3
    private_layers: 3
    decoder_layers: 3
    share_decoder: true
    shared_residual: true
    hier_cond: false
    stop_grad: true
    two_stage: false
    lam: 4.0
    recon_loss_type: additive_matryoshka
    cl_loss_type: fanchor
    epochs: 200
    lr_shared: 5e-5
    lr_private: 5e-5

  factorcl:
    embed_dim: 256
    hidden_dim: 512
    layers: 3
    shared_residual: true
    epochs: 200
    lr: 5e-5
    n_club: 1

  disentangledssl:
    embed_dim: 256
    private_dim: 256
    hidden_dim: 512
    layers: 3
    shared_residual: true
    kappa: 1000.0
    beta: 0.01
    lmd: 0.001
    epochs_s1: 200
    epochs_s2: 120
    lr: 5e-5

  jointdisen:
    embed_dim: 256
    private_dim: 256
    hidden_dim: 512
    layers: 3
    shared_residual: true
    kappa: 1000.0
    a: 1.0
    lmd: 0.001
    epochs: 200
    lr: 5e-5

  repercent:
    tokens: true
    embed_dim: 256
    depth: 2
    cross_heads: 2
    latent_heads: 1
    kappa: 3000.0
    alpha: 2.0
    beta: 2.0
    lmd: 1.0
    epochs: 200
    lr: 5e-5

  finetuned_proj_clip:
    pre_projection: true
    epochs: 100
    lr: 5e-5
    weight_decay: 0.1
    warmup_epochs: 1
